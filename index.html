<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Calidad - Panel PRD</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --warning: #ea580c;
      --gray-btn: #6b7280;
      --bg-panel: #f3f4f6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-panel);
      margin: 0;
      padding: 15px;
      color: #1f2937;
      -webkit-user-select: none;
      user-select: none;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      max-width: 650px;
      margin: 0 auto 15px auto;
      box-sizing: border-box;
    }

    .titulo-panel {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #4b5563;
    }

    /* 📊 BOTONERA SUPERIOR: PARETO DE ESTADOS */
    .pareto-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 20px;
    }

    .btn-prd {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 2px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      color: #374151;
    }

    .btn-prd span.icono {
      font-size: 2.5rem;
      line-height: 1;
    }

    /* ESTADO OK EN VERDE PRETERMINADO */
    .btn-prd.ok-active {
      background-color: var(--success) !important;
      border-color: #bbf7d0 !important;
      color: white !important;
    }

    /* ESTADO DEFECTO EN NARANJA CON GLOW INDUSTRIAL */
    .btn-prd.pareto-active {
      background-color: var(--warning) !important;
      border-color: #fdba74 !important;
      color: white !important;
      box-shadow: 0 0 12px rgba(234, 88, 12, 0.6);
    }

    .btn-prd.pareto-active span.icono,
    .btn-prd.ok-active span.icono {
      color: white !important;
    }

    /* ⌨️ BARRA INFERIOR POR PORCENTAJES DINÁMICOS */
    #linea-controles-prd {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
    }

    #linea-controles-prd button, 
    #linea-controles-prd input {
      transition: width 0.25s ease-in-out, background-color 0.2s ease;
      box-sizing: border-box;
    }

    .input-lector {
      padding: 12px;
      font-size: 1rem;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-weight: bold;
      outline: none;
    }

    .btn-operacion {
      padding: 12px 4px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-azul-camara { background-color: #2563eb; color: white; }
    .btn-gris-digitar { background-color: var(--gray-btn); color: white; }

    /* MUTACIONES DE TU GRÁFICO AL DIGITAR */
    .input-lector.modo-input-expandido {
      width: 75% !important; /* Estira la caja ocupando la pantalla */
      border-color: #2563eb;
    }

    .btn-operacion.modo-enter-compacto {
      background-color: #2563eb !important;
      color: white !important;
      width: 25% !important; /* Se mantiene pequeño e inscrito a la derecha */
    }

    /* 🚨 MODAL GIGANTE DE FLOTACIÓN INDUSTRIAL */
    .modal-exito {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(16,185,129,0.95); z-index: 10000;
      align-items: center; justify-content: center; flex-direction: column; color: white; text-align: center;
    }
    .modal-exito .sku-contenedor-naranja {
      background: rgba(234, 88, 12, 0.9) !important;
      border: 2px solid #fdba74;
    }
  </style>
</head>
<body>

  <!-- MODAL GIGANTE DE NOTIFICACIÓN DE LECTURA -->
  <div id="modal-exito" class="modal-exito">
    <div style="font-size: 6rem; margin-bottom: 5px;">✅</div>
    <div style="font-size: 2rem; font-weight: bold; margin-bottom: 20px;">LECTURA REGISTRADA</div>
    <div id="sku-contenedor" style="background: rgba(0,0,0,0.2); padding: 15px 40px; border-radius: 8px; transition: background 0.2s;">
      <div style="font-size: 1.1rem; opacity: 0.85; margin-bottom: 5px;">SKU PROCESADO:</div>
      <div id="modal-sku" style="font-size: 2.5rem; font-weight: 900; word-break: break-all;">-</div>
    </div>
  </div>

  <!-- INTERFAZ PRINCIPAL PRD -->
  <div class="card">
    <div class="titulo-panel">Panel de Revisión de Productos</div>
    
    <!-- CONTENEDOR DE ESTADOS (MÓDULO DE CORTE SUPERIOR) -->
    <div class="pareto-grid">
      <button id="btn-ok-base" class="btn-prd ok-active" onclick="fijarEstadoCalidad('OK', this)"><span class="icono">🟢</span>OK</button>
      <button class="btn-prd" onclick="fijarEstadoCalidad('DD', this)"><span class="icono">⚠️</span>DD</button>
      <button class="btn-prd" onclick="fijarEstadoCalidad('FUGA', this)"><span class="icono">💧</span>FUGA</button>
      <button class="btn-prd" onclick="fijarEstadoCalidad('ELEC', this)"><span class="icono">⚡</span>ELEC</button>
      <button class="btn-prd" onclick="fijarEstadoCalidad('COMP', this)"><span class="icono">⚙️</span>COMP</button>
      <button class="btn-prd" onclick="fijarEstadoCalidad('EMB', this)"><span class="icono">📦</span>EMB</button>
    </div>

    <!-- CONTENEDOR DE CONTROLES INFERIORES POR PORCENTAJES DE TU FOTO -->
    <div id="linea-controles-prd">
      <!-- 30% INICIAL: BOTÓN CÁMARA AZUL -->
      <button id="btn-camara-toggle" style="width: 30%;" class="btn-operacion btn-azul-camara" onclick="simularToggleCamara()">
        📷 Escanear
      </button>

      <!-- 50% INICIAL: CUADRO DE LECTURA -->
      <input type="text" id="lector-simulado" style="width: 50%;" class="input-lector" placeholder="Simula QR o digite aquí..." onfocus="activarModoDigitacion()" onkeypress="evaluarTeclado(event)">
      
      <!-- 20% INICIAL: BOTÓN GRIS MUTANTE -->
      <button id="btn-accion-dinamico" style="width: 20%;" class="btn-operacion btn-gris-digitar" onclick="gestionarBotonDinamico()">
        ⌨️ Digitar
      </button>
    </div>
  </div>

  <script>
    // --- VARIABLES DE CONTROL GENERAL DE ESTADOS ---
    let seleccionCalidadActiva = "OK"; 
    let enModoDigitacion = false;
    let camaraActivaHardware = false;

    // --- LOGICA DE BOTONERA SUPERIOR ---
    function fijarEstadoCalidad(codigo, boton) {
      // Removemos clases activas previas
      document.querySelectorAll('.btn-prd').forEach(b => {
        b.classList.remove('ok-active', 'pareto-active');
      });

      seleccionCalidadActiva = codigo;

      if (codigo === "OK") {
        boton.classList.add('ok-active');
      } else {
        boton.classList.add('pareto-active');
      }
      console.log("Estado prefijado listo para el próximo QR:", seleccionCalidadActiva);
    }

    // --- ⌨️ LÓGICA DE MUTACIÓN INFERIOR (COMPORTAMIENTO EXACTO DE TU FOTO) ---
    function activarModoDigitacion() {
      if (enModoDigitacion) return;
      enModoDigitacion = true;
      
      // 1. Ocultamos el botón de escaneo izquierdo por completo
      document.getElementById('btn-camara-toggle').style.display = "none";
      
      // 2. Expandimos el cuadro de texto al 75% hacia la izquierda
      document.getElementById('lector-simulado').classList.add('modo-input-expandido');
      
      // 3. Modificamos el botón derecho a Azul ENTER amarrado al 25%
      const btn = document.getElementById('btn-accion-dinamico');
      if (btn) {
        btn.innerText = "▶️ ENTER";
        btn.classList.remove('btn-gris-digitar');
        btn.classList.add('modo-enter-compacto');
      }
      
      // REGLA CRÍTICA DE TU DIBUJO: No tocamos la botonera de arriba, se congela esperando datos
      console.log("Modo manual activo. Sosteniendo selección superior:", seleccionCalidadActiva);
    }

    function restaurarBotoneraInferior() {
      enModoDigitacion = false;
      
      // 1. Reaparece el botón de la cámara con su 30% original
      document.getElementById('btn-camara-toggle').style.display = "flex";
      
      // 2. Encogemos el input devolviéndolo al 50%
      document.getElementById('lector-simulado').classList.remove('modo-input-expandido');
      
      // 3. Regresamos el botón derecho a su estado gris de "Digitar" al 20%
      const btn = document.getElementById('btn-accion-dinamico');
      if (btn) {
        btn.innerText = "⌨️ Digitar";
        btn.classList.remove('modo-enter-compacto');
        btn.classList.add('btn-gris-digitar');
      }
      
      const input = document.getElementById('lector-simulado');
      input.value = "";
      input.blur(); // Contrae el teclado de la tablet
    }

    // --- PROCESADOR DE ENTRADA CENTRAL ---
       // --- PROCESADOR DE ENTRADA CENTRAL ---
    function evaluarTeclado(e) {
      if (e.key !== 'Enter') return;
      
      const input = document.getElementById('lector-simulado');
      const valor = input.value.trim();
      
      // REGLA DE ORO: Si presiona enter vacío, contrae la barra pero CONSERVA el Pareto esperando ingreso
      if (!valor) {
        console.log("Enter vacío. Contrayendo controles pero manteniendo estado superior.");
        restaurarBotoneraInferior();
        return;
      }

      // Procesamiento normal si el campo viene con texto escrito
      let sku = valor.toUpperCase();
      if (valor.includes('#')) {
        sku = valor.split('#')[0].toUpperCase(); // Tomamos solo el SKU limpio antes del #
      }

      // Determinamos el color del cartel según la selección que dejamos congelada arriba
      const esDefecto = seleccionCalidadActiva !== "OK";
      const textoCartel = sku + (esDefecto ? ` (${seleccionCalidadActiva})` : "");
      
      // 1. Lanzamos el cartel de éxito (Verde o Naranja)
      dispararCartelExito(textoCartel, esDefecto);

      // 2. Limpiamos inmediatamente la caja de texto para la próxima lectura
      input.value = "";
    }

    function gestionarBotonDinamico() {
      if (!enModoDigitacion) {
        document.getElementById('lector-simulado').focus();
        activarModoDigitacion();
      } else {
        evaluarTeclado({ key: 'Enter' });
      }
    }

    // --- CONTROLES AUXILIARES DE COHESIÓN ---
    function simularToggleCamara() {
      if (!camaraActivaHardware) {
        camaraActivaHardware = true;
        console.log("Disparando API nativa de la cámara para la racha: " + seleccionCalidadActiva);
        // Aquí llamas a tu función real: encenderCamaraBodega()
      } else {
        camaraActivaHardware = false;
        console.log("Cámara apagada desde el borde inferior.");
      }
    }

    // --- 🚨 EL TEMPORIZADOR QUE REPARA LA PANTALLA COMPLETA ---
    function dispararCartelExito(texto, esDefecto) {
      const modal = document.getElementById('modal-exito');
      const contenedor = document.getElementById('sku-contenedor');
      document.getElementById('modal-sku').innerText = texto;
      
      if (esDefecto) {
        contenedor.classList.add('sku-contenedor-naranja');
      } else {
        contenedor.classList.remove('sku-contenedor-naranja');
      }
      
      modal.style.display = "flex";
      
      // EL FILTRO SECUENCIAL CRÍTICO:
      // Cuando el letrero se desvanece a los 1.3 segundos, resetea TODA la pantalla al estado normal de fábrica
      setTimeout(() => { 
        modal.style.display = "none"; 
        
        // 1. Cierra el teclado, reaparece el botón de la cámara y vuelve el botón derecho a gris "Digitar"
        restaurarBotoneraInferior();
        
        // 2. Auto-repara la botonera superior: regresa al OK verde predeterminado nativo de la línea
        fijarEstadoCalidad('OK', document.getElementById('btn-ok-base'));
        
        console.log("Pantalla reajustada automáticamente al modo estándar: OK Verde / Cámara Disponible / Digitar Gris.");
      }, 1300);
    }
  </script>
</body>
</html>
